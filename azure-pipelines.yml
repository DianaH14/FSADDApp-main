# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  frontendPath: 'photography-app'

steps:
  - task: UseNode@1
    displayName: 'Install Node.js'
    inputs:
      versionSpec: '$(nodeVersion)'

  - task: Cache@2
    displayName: 'Restore npm cache'
    inputs:
      key: 'npm | "$(Agent.OS)" | $(frontendPath)/package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(frontendPath)/node_modules

  - script: |
      cd $(frontendPath)
      npm ci
    displayName: 'Install frontend dependencies'

  - script: |
      cd $(frontendPath)
      npm run test:ci
    displayName: 'Run Angular unit tests'

  - script: |
      cd $(frontendPath)
      npm run build -- --configuration production
    displayName: 'Build Angular application'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish coverage artifact'
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/photography-app/coverage'
      ArtifactName: 'frontend-coverage'
      publishLocation: 'Container'
    condition: succeeded()